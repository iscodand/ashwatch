name: Build and Push API (.NET)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ashwatch-command-api
  ECS_CLUSTER: ashwatch_cluster
  ECS_SERVICE: ashwatch-command-api-service
  ECS_TASK_DEFINITION_FAMILY: ashwatch-command-api
  CONTAINER_NAME: command-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ashwatch-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login on ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image already exists
        id: check-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          output=$(aws ecr describe-images \
              --repository-name $ECR_REPOSITORY \
              --image-ids imageTag=$IMAGE_TAG \
              --region ${{ env.AWS_REGION }} 2>&1) && exit_code=0 || exit_code=$?

          if [ $exit_code -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -q "ImageNotFoundException"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Erro inesperado ao checar imagem:"
            echo "$output"
            exit 1
          fi

      - name: Build image
        if: steps.check-image.outputs.exists == 'false'
        working-directory: ./ashwatch-api
        run: |
          docker build -t ${{ steps.check-image.outputs.image }} .

      - name: Push image
        if: steps.check-image.outputs.exists == 'false'
        run: |
          docker push ${{ steps.check-image.outputs.image }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.check-image.outputs.image }}

      - name: ECS Deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
